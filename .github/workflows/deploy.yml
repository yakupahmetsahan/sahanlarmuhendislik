name: İHS Hosting'e Otomatik Yükle

# Bu dosya main dalına her "push" yapıldığında otomatik çalışır ve
# hem statik siteyi hem admin paneli FTP ile hostinge yükler.
#
# ÇALIŞMASI İÇİN GEREKLİ: repo Settings -> Secrets and variables -> Actions
# altına şu 3 "secret" eklenmeli (İHS panelinizdeki FTP bilgileri):
#   FTP_SERVER    -> örn: ftp.sahanlarmuhendislik.com
#   FTP_USERNAME  -> İHS FTP kullanıcı adınız
#   FTP_PASSWORD  -> İHS FTP şifreniz
#
# Aşağıdaki "server-dir" (hedef klasör) değerlerini kendi hosting
# klasör yapınıza göre değiştirmeniz gerekebilir.

on:
  workflow_dispatch:   # şimdilik elle tetikleniyor — bağlantı doğrulanınca "push" tetikleyicisini geri ekleriz

jobs:
  network-test:
    name: Bağlantı testi (teşhis amaçlı)
    runs-on: ubuntu-latest
    steps:
      - name: Bu çalıştırmanın kaynak (public) IP adresini göster
        run: |
          echo "Bu GitHub Actions çalıştırmasının kullandığı public IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "Tarih/saat (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"

      - name: FTP sunucusuna ham bağlantı testi (port 21)
        run: |
          echo "Sunucuya bağlanmayı deniyorum..."
          timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.FTP_SERVER }}/21" \
            && echo "✅ BAŞARILI: port 21'e bağlanabildim, sorun FTP protokolünde/kimlik doğrulamada olabilir." \
            || echo "❌ BAŞARISIZ: port 21'e hiç bağlanamadım — hosting GitHub'ın IP'sini engelliyor olabilir."

  deploy-site:
    name: Statik siteyi yükle (ana domain)
    needs: network-test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: lftp kur
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Bu çalıştırmanın kaynak (public) IP'si ve saati (İHS'e bildirmek için)
        run: |
          echo "Kaynak IP: $(curl -s https://api.ipify.org)"
          echo "Tarih/saat (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"

      - name: FTP ile siteyi yükle (lftp, ayrıntılı log açık)
        run: |
          lftp -d -e "
          set ftp:ssl-allow true;
          set net:timeout 20;
          set net:max-retries 2;
          set mirror:parallel-transfer-count 3;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror -R --verbose \
            --exclude-glob 'Download/' \
            --exclude-glob 'Guncellemeler/' \
            --exclude-glob 'ProgramSetuplar/' \
            --exclude-glob 'Sozlesmeler/' \
            --exclude-glob 'assets/img/tiles/' \
            --exclude-glob 'logo.png' \
            ./site/ ./http/;
          bye
          "

  deploy-admin:
    name: Admin paneli yükle (alt klasör)
    needs: network-test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: lftp kur
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Bu çalıştırmanın kaynak (public) IP'si ve saati (İHS'e bildirmek için)
        run: |
          echo "Kaynak IP: $(curl -s https://api.ipify.org)"
          echo "Tarih/saat (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"

      - name: FTP ile admin paneli yükle (lftp, ayrıntılı log açık)
        run: |
          lftp -d -e "
          set ftp:ssl-allow true;
          set net:timeout 20;
          set net:max-retries 2;
          set mirror:parallel-transfer-count 3;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror -R --verbose \
            --exclude-glob 'Uploads/' \
            ./admin/ ./http/admin/;
          bye
          "
