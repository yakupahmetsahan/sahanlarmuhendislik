/* ==========================================================================
   ŞAHANLAR MÜHENDİSLİK — shared stylesheet
   Tokens: deep navy base, brand blue, per-category accent (amber/orange/steel/teal)
   Type: Barlow (display) + Barlow (body) + JetBrains Mono (utility tags)
   ========================================================================== */

:root{
  --bg-deep:   #070c18;
  --bg-panel:  #0f1a30;
  --bg-panel-2:#142240;
  --brand:     #2e6fe0;
  --brand-lt:  #5fa8e0;
  --steel:     #93a7c4;
  --ink:       #0a0e16;
  --paper:     #f5f7fb;
  --paper-dim: #e4e9f2;
  --muted:     #8ca0c2;
  --muted-dark:#5a6b8a;

  --elektrik:  #2f7de1;
  --enerji:    #22a35e;
  --asansor:   #64748b;
  --yazilim:   #eab308;
  --hayvancilik: #a0522d;
  --tarim:     #7c9a3c;

  --radius: 4px;
  --ease: cubic-bezier(.16,.8,.24,1);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Barlow', sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
h1,h2,h3,h4{
  font-family:'Barlow', sans-serif;
  font-weight:700;
  letter-spacing:-.01em;
  margin:0 0 .5em;
}
.tag{
  font-family:'JetBrains Mono', monospace;
  font-size:.72rem;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

:focus-visible{ outline:3px solid var(--brand-lt); outline-offset:2px; }

/* ---------- brand banner (logo + category tiles + contact bar) ---------- */
.brand-banner{ background:#fff; border-bottom:1px solid #dde3ee; }
.brand-banner-top{
  display:flex; align-items:center; justify-content:space-between;
  gap:24px; padding:16px 24px; max-width:1180px; margin:0 auto;
}
.brand-banner .brand{ display:flex; align-items:center; gap:10px; flex:none; }
.brand-banner .brand-mark{ height:58px; width:auto; }
.brand-banner .brand-text{ display:flex; flex-direction:column; line-height:1.15; font-family:'Barlow',sans-serif; color:var(--ink); font-size:1.22rem; font-weight:600; }
.brand-banner .brand-text b{ font-weight:700; letter-spacing:.01em; }
.brand-banner .brand-text small{
  font-family:'JetBrains Mono',monospace; font-weight:500; font-size:.62rem;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted-dark);
}
.top-nav{ display:flex; align-items:center; gap:28px; flex:none; }
.top-nav a{
  font-family:'Barlow',sans-serif; font-weight:600; font-size:.92rem;
  letter-spacing:.03em; text-transform:uppercase; color:var(--ink);
  transition:color .2s var(--ease);
  display:inline-flex; align-items:center; gap:7px;
}
.top-nav a svg{ width:16px; height:16px; flex:none; }
.top-nav a:hover{ color:var(--brand); }
.top-nav a.active{ color:var(--brand); }

.cat-tiles-section{ background:var(--paper); padding:28px 0 8px; }
.cat-tiles-section .section-head{ margin-bottom:18px; }
.cat-tiles{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  max-width:1180px; margin:0 auto; padding:0 24px 16px;
}
.cat-tile{
  position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden;
  display:block; box-shadow:0 1px 2px rgba(16,25,43,.08);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.cat-tile:hover{ transform:translateY(-2px); box-shadow:0 10px 22px rgba(16,25,43,.16); }
.cat-tile .photo{ position:absolute; inset:0; background-size:cover; background-position:center; }
.cat-tile.no-photo .photo{
  background:linear-gradient(155deg, color-mix(in srgb, var(--brand) 85%, black) 0%, var(--brand) 100%);
}
.cat-tile .tile-icon{
  position:absolute; right:-8%; bottom:-8%; width:60%; height:60%; color:rgba(255,255,255,.22);
}
.cat-tile .tile-icon svg{ width:100%; height:100%; }
.cat-tile .shade{ position:absolute; inset:0; background:linear-gradient(to top, rgba(6,10,20,.55), transparent 55%); }
.cat-tile .label{
  position:absolute; top:8px; left:8px; right:8px;
  background:var(--ink); color:#fff; text-align:center;
  font-family:'Barlow',sans-serif; font-weight:700; font-size:.82rem;
  padding:5px 4px; border-radius:4px; letter-spacing:.02em;
}
.cat-tile[data-cat="elektrik"] .label{ background:var(--brand); }
.cat-tile[data-cat="enerji"] .label{ background:var(--brand); }
.cat-tile[data-cat="asansor"] .label{ background:var(--brand); }
.cat-tile[data-cat="yazilim"] .label{ background:var(--brand); }
.cat-tile[data-cat="hayvancilik"] .label{ background:var(--brand); }
.cat-tile[data-cat="tarim"] .label{ background:var(--brand); }
.cat-tile.active{ box-shadow:0 0 0 2px var(--brand), 0 6px 16px rgba(16,25,43,.14); }

.contact-bar{ background:var(--brand); color:#fff; }
.contact-bar .wrap{
  display:flex; align-items:center; justify-content:center; gap:32px;
  padding:10px 24px; font-size:.85rem; flex-wrap:wrap;
}
.contact-bar a{ color:#fff; display:flex; align-items:center; gap:8px; }
.contact-bar a:hover{ color:var(--brand-lt); }
.contact-bar svg{ width:15px; height:15px; flex:none; }

@media (max-width:820px){
  .brand-banner-top{ flex-wrap:wrap; }
  .cat-tiles{ grid-template-columns:repeat(2,1fr); gap:8px; }
  .cat-tile .label{ font-size:.68rem; padding:4px 2px; }
  .contact-bar .wrap{ gap:16px; font-size:.78rem; }
}
@media (max-width:520px){
  .cat-tiles{ grid-template-columns:repeat(2,1fr); }
}

/* ---------- index hero banner (photo collage, corporate entrance) ---------- */
.hero-banner{
  position:relative; height:340px; overflow:hidden;
}
.hero-banner .panels{ position:absolute; inset:0; display:flex; }
.hero-banner .panels span{
  flex:1; background-size:cover; background-position:center;
  filter:saturate(1.05);
}
.hero-banner .overlay{
  position:absolute; inset:0;
  background:
    linear-gradient(to top, rgba(6,10,20,.82) 0%, rgba(6,10,20,.35) 55%, rgba(6,10,20,.55) 100%);
}
.hero-banner .content{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:0 20px;
}
.hero-banner .eyebrow{
  color:#fff; opacity:.85; font-family:'JetBrains Mono',monospace; font-size:.72rem;
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:12px;
}
.hero-banner h1{
  color:#fff; font-size:clamp(1.9rem, 4.4vw, 3.1rem); margin:0 0 .4em; max-width:820px;
}
.hero-banner h1 span{ color:var(--brand-lt); }
.hero-banner p.lead{ color:rgba(255,255,255,.88); max-width:560px; font-size:1.05rem; margin:0; }
@media (max-width:640px){
  .hero-banner{ height:420px; }
  .hero-banner .panels span:nth-child(3), .hero-banner .panels span:nth-child(4){ display:none; }
}

/* ---------- index hero ---------- */
.hero{
  background:
    radial-gradient(ellipse 1100px 480px at 50% -15%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 65%),
    linear-gradient(180deg, #eef2f9 0%, var(--paper) 55%);
  color:var(--ink);
  padding:40px 0 40px;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(46,111,224,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,111,224,.07) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse 900px 500px at 50% 0%, black, transparent 70%);
  pointer-events:none;
}
.hero-inner{ position:relative; text-align:center; }
.hero .hero-photo{
  max-width:520px; width:100%; height:auto; margin:0 auto; display:block;
  border-radius:10px; box-shadow:0 16px 40px rgba(16,25,43,.14); border:1px solid #e3e8f0;
}
.hero .eyebrow{
  color:var(--brand); margin-bottom:10px; display:block;
}
.hero h1{
  font-size:clamp(1.9rem, 4.4vw, 3.1rem);
  margin-bottom:.35em;
  color:var(--ink);
}
.hero h1 span{ color:var(--brand); }
.hero p.lead{
  color:var(--muted-dark); max-width:560px; margin:0 auto;
  font-size:1.05rem;
}

/* ---------- door bank (signature element) ---------- */
.doorbank{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:16px; margin-top:48px;
}
.door{
  --accent:#5fa8e0;
  position:relative;
  aspect-ratio:3/4;
  border-radius:12px;
  overflow:hidden;
  display:block;
  box-shadow:0 1px 2px rgba(16,25,43,.06);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.door[data-cat="elektrik"]{ --accent: var(--elektrik); }
.door[data-cat="enerji"]{ --accent: var(--enerji); }
.door[data-cat="asansor"]{ --accent: var(--asansor); }
.door[data-cat="yazilim"]{ --accent: var(--yazilim); }

.door .bg{
  position:absolute; inset:0; background-size:cover; background-position:center;
  transform:scale(1.04); transition:transform .6s var(--ease);
}
.door.no-photo .bg{
  background-image:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.16), transparent 45%),
    linear-gradient(155deg, color-mix(in srgb, var(--accent) 88%, black) 0%, var(--accent) 60%, color-mix(in srgb, var(--accent) 80%, #000 10%) 100%);
}
.door.no-photo .bg-icon{
  position:absolute; right:-18px; bottom:-18px; width:66%; height:66%;
  color:rgba(255,255,255,.14); pointer-events:none;
}
.door.no-photo .bg-icon svg{ width:100%; height:100%; }

.door .overlay{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(6,10,20,.88) 0%, rgba(6,10,20,.35) 42%, rgba(6,10,20,.08) 65%, rgba(6,10,20,.32) 100%);
}
.door.no-photo .overlay{
  background:linear-gradient(to top, rgba(0,0,0,.32) 0%, rgba(0,0,0,.05) 45%, rgba(0,0,0,.18) 100%);
}

.door .content{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column; justify-content:space-between; padding:16px;
}
.door .icon-badge{
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); color:#fff;
  transition:background .3s var(--ease), transform .3s var(--ease);
}
.door .icon-badge svg{ width:21px; height:21px; }

.door .bottom{ color:#fff; }
.door h3{ color:#fff; font-size:1.08rem; margin:0 0 3px; letter-spacing:.01em; }
.door .tagline{ color:rgba(255,255,255,.82); font-size:.8rem; line-height:1.35; margin:0; }
.door .desc{
  color:rgba(255,255,255,.88); font-size:.8rem; line-height:1.4; margin:8px 0 0;
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .35s var(--ease), opacity .3s var(--ease), margin .35s var(--ease);
}
.door .go{
  margin-top:10px; display:inline-flex; align-items:center; gap:6px;
  font-family:'Barlow',sans-serif; font-weight:600; font-size:.86rem; color:#fff;
}
.door .go svg{ width:15px; height:15px; transition:transform .3s var(--ease); }

.door:hover, .door:focus-visible{ transform:translateY(-4px); box-shadow:0 18px 34px rgba(16,25,43,.22); }
.door:hover .bg, .door:focus-visible .bg{ transform:scale(1.1); }
.door:hover .icon-badge, .door:focus-visible .icon-badge{ background:var(--accent); border-color:var(--accent); }
.door:hover .desc, .door:focus-visible .desc{ max-height:80px; opacity:1; margin:8px 0 0; }
.door:hover .go svg, .door:focus-visible .go svg{ transform:translateX(4px); }
.door:active{ transform:translateY(-1px); }

@media (max-width:820px){

  .doorbank{ grid-template-columns:repeat(2,1fr); }
  .door{ aspect-ratio:1/1; }
}
@media (max-width:520px){
  .doorbank{ grid-template-columns:1fr; }
  .door{ aspect-ratio:16/10; }
}

/* ---------- index: strip / about ---------- */
.strip{ background:var(--paper); color:var(--ink); padding:30px 0; border-bottom:1px solid #e3e8f0; }
.strip .wrap{ display:flex; flex-wrap:wrap; gap:28px 48px; align-items:center; justify-content:space-between; }
.strip .item{ display:flex; align-items:baseline; gap:10px; }
.strip .item b{ font-family:'Barlow',sans-serif; font-size:1.5rem; color:var(--brand); }
.strip .item span{ color:var(--muted-dark); font-size:.86rem; }

.section{ padding:72px 0; }
.section-head{ max-width:640px; margin-bottom:36px; }
.section-head .tag{ color:var(--brand); display:block; margin-bottom:8px; }
.section-head h2{ font-size:clamp(1.5rem,3vw,2rem); }
.section-head p{ color:var(--muted-dark); }

.about-grid{ max-width:720px; }
.about-grid p{ color:#3c465c; margin:0 0 14px; }

/* ---------- category pages ---------- */
.cat-hero{
  --accent: var(--brand);
  background:linear-gradient(180deg, #eef2f9 0%, var(--paper) 60%);
  color:var(--ink);
  padding:48px 0; position:relative; overflow:hidden;
  border-bottom:1px solid #e3e8f0;
}
.cat-hero::before{ content:none; }
.cat-hero .wrap{ position:relative; display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center; }
.cat-hero .tag{ color:color-mix(in srgb, var(--accent) 70%, black); }
.cat-hero h1{ font-size:clamp(1.8rem,4vw,2.7rem); color:var(--ink); }
.cat-hero p.lead{ color:var(--muted-dark); font-size:1.02rem; }
.breadcrumb{ font-family:'JetBrains Mono',monospace; font-size:.76rem; color:var(--muted-dark); margin-bottom:18px; }
.breadcrumb a:hover{ color:var(--ink); }

.cat-hero-visual{
  position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden;
  box-shadow:0 20px 44px rgba(16,25,43,.16);
}
.cat-hero-visual .photo{ position:absolute; inset:0; background-size:cover; background-position:center; }
.cat-hero-visual.no-photo .photo{
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 45%),
    linear-gradient(155deg, color-mix(in srgb, var(--accent) 88%, black) 0%, var(--accent) 60%, color-mix(in srgb, var(--accent) 80%, #000 10%) 100%);
}
.cat-hero-visual .wm{
  position:absolute; right:-10%; bottom:-10%; width:70%; height:70%; color:rgba(255,255,255,.16);
}
.cat-hero-visual .wm svg{ width:100%; height:100%; }
.cat-hero-visual .caption{
  position:absolute; left:0; right:0; bottom:0; padding:16px 18px;
  background:linear-gradient(to top, rgba(6,10,20,.75), transparent);
  color:#fff; font-size:.82rem;
}
@media (max-width:820px){
  .cat-hero .wrap{ grid-template-columns:1fr; }
  .cat-hero-visual{ order:-1; aspect-ratio:16/9; }
}

.services{
  display:grid; grid-template-columns:repeat(3,1fr); gap:2px;
  background:#dde3ee; border:1px solid #dde3ee; margin-top:8px;
}
.service{ background:var(--paper); padding:26px 24px; }
.service .icon{
  width:38px; height:38px; border-radius:50%; margin-bottom:14px;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--accent) 14%, white); color:color-mix(in srgb, var(--accent) 70%, black);
}
.service .icon svg{ width:19px; height:19px; }
.service h4{ font-size:1rem; margin-bottom:6px; }
.service p{ color:var(--muted-dark); font-size:.92rem; margin:0; }
@media (max-width:820px){ .services{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .services{ grid-template-columns:1fr; } }

.panel-band{ background:#f6f8fc; color:var(--ink); padding:56px 0; border-top:1px solid #e3e8f0; border-bottom:1px solid #e3e8f0; }
.panel-band .wrap{ display:grid; grid-template-columns:.9fr 1.1fr; gap:40px; align-items:center; }
.panel-band h2{ font-size:1.7rem; }
.panel-band p{ color:var(--muted-dark); }
.panel-band .refs{ display:flex; flex-direction:column; gap:10px; }
.ref-chip{
  display:flex; align-items:center; gap:12px;
  border:1px solid #dde3ee; border-radius:var(--radius);
  padding:14px 16px; background:var(--paper);
}
.ref-chip .dot{ width:8px; height:8px; border-radius:50%; background:color-mix(in srgb, var(--accent) 70%, black); flex:none; }
.ref-chip b{ font-family:'Barlow',sans-serif; font-size:1rem; letter-spacing:.02em; }
.ref-chip span{ color:var(--muted-dark); font-size:.84rem; display:block; }
@media (max-width:820px){ .panel-band .wrap{ grid-template-columns:1fr; } }

/* ---------- references / project gallery ---------- */
.gallery-section{ padding:72px 0; background:var(--paper); }
.gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:8px; }
.ref-card{
  border:1px solid #e3e8f0; border-radius:8px; overflow:hidden; background:#fff;
  box-shadow:0 1px 2px rgba(16,25,43,.04);
  transition:box-shadow .25s var(--ease), transform .25s var(--ease);
}
.ref-card:hover{ box-shadow:0 10px 24px rgba(16,25,43,.08); transform:translateY(-2px); }
.ref-card .shot{
  aspect-ratio:4/3; background:
    linear-gradient(155deg, color-mix(in srgb, var(--accent) 16%, white), #eef1f7 60%);
  display:flex; align-items:center; justify-content:center; position:relative;
  border-bottom:1px solid #e3e8f0;
}
.ref-card .shot svg{ width:34px; height:34px; color:color-mix(in srgb, var(--accent) 55%, #7c8aa6); opacity:.8; }
.ref-card .shot .placeholder-label{
  position:absolute; bottom:10px; left:10px; right:10px;
  font-family:'JetBrains Mono',monospace; font-size:.66rem; letter-spacing:.06em;
  color:color-mix(in srgb, var(--accent) 60%, #56607a); text-transform:uppercase;
}
.ref-card .info{ padding:16px 18px; }
.ref-card .info b{ font-family:'Barlow',sans-serif; font-size:1rem; display:block; margin-bottom:3px; }
.ref-card .info span{ color:var(--muted-dark); font-size:.85rem; }
@media (max-width:820px){ .gallery{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .gallery{ grid-template-columns:1fr; } }

.gallery-note{
  margin-top:22px; padding:14px 18px; border-radius:6px;
  background:#f6f8fc; border:1px dashed #cdd6e6;
  font-size:.86rem; color:var(--muted-dark);
}
.gallery-note b{ color:var(--ink); }

/* ---------- team ---------- */
.team-group{ margin-bottom:34px; }
.team-group:last-child{ margin-bottom:0; }
.team-group h3{
  font-size:.82rem; letter-spacing:.1em; color:var(--muted-dark);
  font-family:'JetBrains Mono',monospace; text-transform:uppercase; font-weight:500;
  margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #e3e8f0;
}
.team-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.team-card{
  display:flex; align-items:center; gap:14px;
  border:1px solid #e3e8f0; border-radius:8px; padding:14px 16px; background:#fff;
  transition:box-shadow .2s var(--ease), transform .2s var(--ease);
}
.team-card:hover{ box-shadow:0 8px 20px rgba(16,25,43,.07); transform:translateY(-1px); }
.team-card .avatar{
  flex:none; width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--brand) 10%, white); color:var(--brand);
  font-family:'Barlow',sans-serif; font-weight:700; font-size:1rem;
  border:1px solid color-mix(in srgb, var(--brand) 22%, #e3e8f0);
}
.team-card b{ font-family:'Barlow',sans-serif; font-size:.98rem; display:block; }
.team-card span{ color:var(--muted-dark); font-size:.82rem; }
@media (max-width:820px){ .team-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .team-grid{ grid-template-columns:1fr; } }

/* ---------- highlight project stats ---------- */
.highlight-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px; }
.hstat{
  border:1px solid #e3e8f0; border-radius:8px; padding:20px 18px; background:#fff;
  border-top:3px solid var(--accent);
}
.hstat .metric{ font-family:'Barlow',sans-serif; font-weight:700; font-size:1.5rem; color:var(--ink); }
.hstat .metric small{ font-size:.8rem; font-weight:600; color:var(--muted-dark); margin-left:2px; }
.hstat .name{ font-weight:600; font-size:.92rem; margin:8px 0 2px; }
.hstat .loc{ color:var(--muted-dark); font-size:.82rem; }
.hstat .konut{ margin-top:10px; padding-top:10px; border-top:1px dashed #e3e8f0; font-size:.82rem; color:var(--muted-dark); }
.hstat .konut b{ color:var(--ink); }
@media (max-width:820px){ .highlight-stats{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .highlight-stats{ grid-template-columns:1fr; } }

/* ---------- full reference table ---------- */
.ref-table-wrap{
  margin-top:8px; border:1px solid #e3e8f0; border-radius:8px; overflow:hidden;
  max-height:560px; overflow-y:auto;
}
.ref-table{ width:100%; border-collapse:collapse; font-size:.88rem; }
.ref-table thead th{
  position:sticky; top:0; z-index:1;
  background:var(--ink); color:#fff; text-align:left; padding:11px 14px;
  font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; font-weight:500;
}
.ref-table tbody td{ padding:9px 14px; border-top:1px solid #eef1f7; color:#33405c; }
.ref-table tbody tr:nth-child(even){ background:#fafbfd; }
.ref-table tbody tr:hover{ background:color-mix(in srgb, var(--accent) 6%, white); }
.ref-table td:last-child, .ref-table th:last-child{ text-align:right; white-space:nowrap; color:var(--muted-dark); }
.ref-table td:nth-child(4){ color:var(--muted-dark); }
.ref-count{ font-size:.86rem; color:var(--muted-dark); margin:10px 0 0; }
.ref-count b{ color:var(--ink); }

.cta-band{ padding:64px 0; text-align:center; }
.cta-band h2{ font-size:clamp(1.4rem,3vw,2rem); margin-bottom:10px; }
.cta-band p{ color:var(--muted-dark); margin-bottom:26px; }
.btn{
  display:inline-flex; align-items:center; gap:10px;
  font-family:'Barlow',sans-serif; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  background:var(--ink); color:var(--paper); padding:14px 26px; border-radius:999px;
  transition:background .2s var(--ease), transform .2s var(--ease);
}
.btn:hover{ background:var(--brand); transform:translateY(-2px); }
.btn.ghost{ background:transparent; border:1px solid #cdd6e6; color:var(--ink); }
.btn.ghost:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.cta-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

/* ---------- footer ---------- */
.site-footer{ background:var(--brand); color:rgba(255,255,255,.75); padding:28px 0; }
.site-footer .grid{
  display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:32px; margin-bottom:36px;
}
.footer-brand{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.footer-brand img{ height:42px; width:auto; filter:brightness(0) invert(1); }
.footer-brand span{ font-family:'Barlow',sans-serif; font-weight:600; font-size:1.15rem; color:#fff; line-height:1.15; }
.footer-brand span b{ font-weight:700; }
.site-footer .brand-col p{ font-size:.88rem; max-width:280px; color:rgba(255,255,255,.75); }
.footer-email{ display:inline-block; margin:10px 0 18px; font-size:.88rem; color:rgba(255,255,255,.85); }
.footer-email:hover{ color:#fff; }
.social-row{ display:flex; gap:10px; }
.social-row a{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.3); color:rgba(255,255,255,.85);
  transition:color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
}
.social-row a:hover{ color:#fff; border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.12); }
.social-row svg{ width:16px; height:16px; }
.site-footer h5{
  font-family:'JetBrains Mono',monospace; text-transform:uppercase; font-size:.72rem;
  letter-spacing:.12em; color:#fff; margin-bottom:14px;
}
.site-footer ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.site-footer a{ font-size:.9rem; transition:color .2s var(--ease); color:rgba(255,255,255,.75); }
.site-footer a:hover{ color:#fff; }
.site-footer .bottom{
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  font-size:.8rem; color:rgba(255,255,255,.65);
}
@media (max-width:820px){ .site-footer .grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:520px){ .site-footer .grid{ grid-template-columns:1fr; } }

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  html{ scroll-behavior:auto; }
}

</style>
